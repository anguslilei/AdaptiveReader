name: Reader and semantic source native regression
on:
  push:
    branches: ['fix/376-epub-view-typecheck', 'feature/178-native-epub-source-reader', 'feature/179-bounded-semantic-xml', 'feature/180-native-epub-package', 'feature/181-native-semantic-identities']
  pull_request:
    branches: ['feature/177-epub-semantic-source-spike', 'feature/178-native-epub-source-reader', main]
permissions:
  contents: read
concurrency:
  group: native-reader-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash scripts/__tests__/run-tests-xcode-selection.test.sh
      - run: bash scripts/__tests__/run-tests-watchdog.test.sh
      - run: python3 scripts/__tests__/prepare-semantic-version.test.py
  native:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      SEMANTIC_VERSION_BASELINE: 54930d465d57cdce5699f36cf9edd14b222e3655
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select latest stable Xcode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          paths = [(tuple(map(int, m[1].split('.'))), p) for p in Path('/Applications').glob('Xcode_*.app') if (m := re.fullmatch(r'Xcode_([0-9.]+)\.app', p.name))]
          if not paths:
              raise SystemExit('No stable Xcode found')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DEVELOPER_DIR={max(paths)[1]}/Contents/Developer\n')
          PY
      - name: Generate candidate version
        run: |
          brew install xcodegen
          mkdir -p preparation
          xcodebuild -version > preparation/xcode-version.txt
          xcodegen --version > preparation/generator-version.txt
          git rev-parse HEAD > preparation/input-commit.txt
          if [ "$SOURCE_BRANCH" = 'feature/181-native-semantic-identities' ]; then
            git fetch --no-tags --depth=1 origin main
            SEMANTIC_BASELINE_SHA="$(git rev-parse FETCH_HEAD)"
            if [ "$SEMANTIC_BASELINE_SHA" != "$SEMANTIC_VERSION_BASELINE" ]; then
              echo 'Merged-main baseline advanced; reconcile explicit version allocation'
              exit 1
            fi
            git show "$SEMANTIC_BASELINE_SHA:project.yml" > preparation/version-baseline.yml
            python3 scripts/prepare-semantic-version.py \
              --baseline-yml preparation/version-baseline.yml \
              --baseline-sha "$SEMANTIC_BASELINE_SHA" \
              --input-yml project.yml --output-dir preparation
          else
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('project.yml')
          s = p.read_text()
          s = re.sub(r'CURRENT_PROJECT_VERSION: (1051|1052|1053|1054)\b', 'CURRENT_PROJECT_VERSION: 1054', s)
          s = re.sub(r'MARKETING_VERSION: 3\.67\.(9|10|11|12)\b', 'MARKETING_VERSION: 3.67.12', s)
          if 'MARKETING_VERSION: 3.67.12' not in s or 'CURRENT_PROJECT_VERSION: 1054' not in s:
              raise SystemExit('Unexpected candidate version baseline')
          p.write_text(s)
          PY
          fi
          xcodegen generate
          cp project.yml preparation/project.yml
          cp vreader.xcodeproj/project.pbxproj preparation/project.pbxproj
      - name: Select isolated test simulator
        run: |
          xcrun simctl list devices available --json > preparation/devices.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('preparation/devices.json'))['devices']
          candidates = [(('iPhone 17 Pro' == x['name']), runtime, x['udid']) for runtime, devices in d.items() if 'iOS' in runtime for x in devices if x.get('isAvailable') and x['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          chosen = max(candidates)[2]
          open('preparation/test-udid.txt', 'w').write(chosen)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TEST_UDID={chosen}\n')
          PY
      - name: Debug compiler regression
        run: |
          set -o pipefail
          xcodebuild build -project vreader.xcodeproj -scheme vreader \
            -configuration Debug -destination "platform=iOS Simulator,id=$TEST_UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee preparation/debug-build.log
      - name: Release compiler regression
        run: |
          set -o pipefail
          xcodebuild build -project vreader.xcodeproj -scheme vreader \
            -configuration Release -destination "platform=iOS Simulator,id=$TEST_UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee preparation/release-build.log
      - name: Boot isolated test simulator
        run: |
          TEST_SIM=$(cat preparation/test-udid.txt)
          xcrun simctl boot "$TEST_SIM"
          xcrun simctl bootstatus "$TEST_SIM" -b
      - name: Related EPUB tests through watchdog wrapper
        env:
          TIMEOUT_SECS: '1800'
        run: bash scripts/test-native-semantic-foundations.sh
      - name: Export source-pinned evidence for review
        if: always()
        run: python3 scripts/export-native-package-evidence.py
      - name: Save compiler and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reader-${{ github.sha }}
          path: preparation/
          retention-days: 7
          if-no-files-found: error
