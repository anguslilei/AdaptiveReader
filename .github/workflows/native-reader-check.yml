name: Reader and semantic source native regression
on:
  push:
    branches: ['fix/376-epub-view-typecheck', 'feature/178-native-epub-source-reader']
  pull_request:
    branches: ['feature/177-epub-semantic-source-spike', main]
permissions:
  contents: read
concurrency:
  group: native-reader-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: bash scripts/__tests__/run-tests-xcode-selection.test.sh
      - run: bash scripts/__tests__/run-tests-watchdog.test.sh
  native:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select latest stable Xcode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          paths = [(tuple(map(int, m[1].split('.'))), p) for p in Path('/Applications').glob('Xcode_*.app') if (m := re.fullmatch(r'Xcode_([0-9.]+)\.app', p.name))]
          if not paths:
              raise SystemExit('No stable Xcode found')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DEVELOPER_DIR={max(paths)[1]}/Contents/Developer\n')
          PY
      - name: Generate candidate version
        run: |
          brew install xcodegen
          mkdir -p preparation
          xcodebuild -version > preparation/xcode-version.txt
          xcodegen --version > preparation/generator-version.txt
          git rev-parse HEAD > preparation/input-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('project.yml')
          s = p.read_text()
          s = re.sub(r'CURRENT_PROJECT_VERSION: (1051|1052)\b', 'CURRENT_PROJECT_VERSION: 1052', s)
          s = re.sub(r'MARKETING_VERSION: 3\.67\.(9|10)\b', 'MARKETING_VERSION: 3.67.10', s)
          if 'MARKETING_VERSION: 3.67.10' not in s or 'CURRENT_PROJECT_VERSION: 1052' not in s:
              raise SystemExit('Unexpected candidate version baseline')
          p.write_text(s)
          PY
          xcodegen generate
          cp project.yml preparation/project.yml
          cp vreader.xcodeproj/project.pbxproj preparation/project.pbxproj
      - name: Select isolated test simulator
        run: |
          xcrun simctl list devices available --json > preparation/devices.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('preparation/devices.json'))['devices']
          candidates = [(('iPhone 17 Pro' == x['name']), runtime, x['udid']) for runtime, devices in d.items() if 'iOS' in runtime for x in devices if x.get('isAvailable') and x['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          chosen = max(candidates)[2]
          open('preparation/test-udid.txt', 'w').write(chosen)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'TEST_UDID={chosen}\n')
          PY
      - name: Debug compiler regression
        run: |
          set -o pipefail
          xcodebuild build -project vreader.xcodeproj -scheme vreader \
            -configuration Debug -destination "platform=iOS Simulator,id=$TEST_UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee preparation/debug-build.log
      - name: Release compiler regression
        run: |
          set -o pipefail
          xcodebuild build -project vreader.xcodeproj -scheme vreader \
            -configuration Release -destination "platform=iOS Simulator,id=$TEST_UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee preparation/release-build.log
      - name: Boot isolated test simulator
        run: |
          TEST_SIM=$(cat preparation/test-udid.txt)
          xcrun simctl boot "$TEST_SIM"
          xcrun simctl bootstatus "$TEST_SIM" -b
      - name: Related EPUB tests through watchdog wrapper
        env:
          TIMEOUT_SECS: '1800'
        run: |
          xcodebuild -version > preparation/test-xcode-version.txt
          set +e
          date +%s > preparation/test-start.txt
          bash scripts/run-tests.sh \
            vreaderTests/EPUBReaderViewModelOpenTests \
            vreaderTests/EPUBReaderViewModelCloseTests \
            vreaderTests/EPUBReaderViewModelNavigationTests \
            vreaderTests/EPUBReaderViewModelLifecycleTests \
            vreaderTests/EPUBReaderViewModelEdgeCaseTests \
            vreaderTests/EPUBChapterNavigationRouterTests \
            vreaderTests/EPUBChapterWrapPendingTargetTests \
            vreaderTests/EPUBReaderHostLifecycleTests \
            vreaderTests/ReaderEngineTests \
            vreaderTests/ReaderContainerViewEngineDispatchTests \
            vreaderTests/EPUBBilingualOrchestratorTests \
            vreaderTests/EPUBSemanticResourceReaderTests \
            vreaderTests/EPUBSourceZIPValidationTests \
            vreaderTests/EPUBSourceBudgetTests \
            > preparation/test-wrapper.log 2>&1
          TEST_EXIT=$?
          set -e
          printf '%s\n' "$TEST_EXIT" > preparation/test-command-status.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          wrapper = Path('preparation/test-wrapper.log').read_text()
          print(wrapper)
          first = wrapper.splitlines()[0] if wrapper else ''
          match = re.search(r' log=(/var/folders/[^/]+/[^/]+/T/run-tests\.[^\s]+)$', first)
          if match and Path(match[1]).is_file():
              shutil.copyfile(match[1], 'preparation/test-full.log')
              for line in Path(match[1]).read_text(errors='replace').splitlines():
                  if any(term in line for term in ['✘', 'Expectation failed', 'Issue recorded', 'error:']):
                      print(line)
          PY
          exit "$TEST_EXIT"
      - name: Verify actual test results are nonempty
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          start = float(Path('preparation/test-start.txt').read_text())
          results = [p for p in (Path.home() / 'Library/Developer/Xcode/DerivedData').glob('*/Logs/Test/*.xcresult') if p.stat().st_mtime >= start and (p / 'Info.plist').is_file()]
          if not results:
              raise SystemExit('No result bundle from this test invocation')
          Path('preparation/test-result-path.txt').write_text(str(max(results, key=lambda p: p.stat().st_mtime)))
          PY
          RESULT_PATH=$(cat preparation/test-result-path.txt)
          xcrun xcresulttool get test-results summary --path "$RESULT_PATH" > preparation/test-summary.json
          xcrun xcresulttool get test-results tests --path "$RESULT_PATH" > preparation/test-tree.json
          python3 - <<'PY'
          import json
          d = json.load(open('preparation/test-summary.json'))
          counts = [d.get(key) for key in ['totalTestCount', 'passedTests', 'failedTests', 'skippedTests']]
          if any(type(value) is not int for value in counts) or counts[0] <= 0 or counts[1] <= 0 or counts[2] != 0 or counts[3] != 0:
              raise SystemExit('Expected executed passing native tests and complete count fields')
          def nodes(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from nodes(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from nodes(child)
          tree = json.load(open('preparation/test-tree.json'))
          aliases = [
              ('EPUBSemanticResourceReaderTests', 'Semantic EPUB resources'),
              ('EPUBSourceZIPValidationTests', 'Semantic EPUB ZIP grammar'),
              ('EPUBSourceBudgetTests', 'Semantic EPUB budgets and cancellation'),
          ]
          for names in aliases:
              found = [n for n in nodes(tree) if any(name in str(n.get('name', '')) or name in str(n.get('nodeIdentifier', '')) for name in names)]
              if not any(n.get('result') == 'Passed' for n in found):
                  raise SystemExit('Missing executed passing source suite: ' + names[0])
          print('Native tests:', counts[0], 'passed:', counts[1], 'all three new suites executed')
          PY
      - name: Save compiler and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reader-${{ github.sha }}
          path: preparation/
          retention-days: 7
          if-no-files-found: error
